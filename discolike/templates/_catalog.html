<!-- disco/templates/_catalog.html -->
<div class="cat-grid">
  {% for a in apps %}
  {% if a.broken %}
  <div class="cat-card broken">
    <div class="card-top">
      <div class="card-name">{{ a.name }}</div>
      <span class="badge badge--failed">broken</span>
    </div>
    <div class="card-error">{{ a.error }}</div>
  </div>
  {% else %}
  <div class="cat-card">
    <div class="card-top">
      <div class="card-name">{{ a.name }}</div>
      <span class="badge badge--{{ a.status }}">{{ a.status }}</span>
    </div>
    <div class="card-desc">{{ a.description }}</div>
    <div class="card-actions">
      <button class="btn" hx-post="/apps/{{ a.name }}/start" hx-target="#catalog" hx-swap="innerHTML">Start</button>
      <button class="btn" hx-post="/apps/{{ a.name }}/stop" hx-target="#catalog" hx-swap="innerHTML">Stop</button>
      {% if a.status == "ready" %}
      <a class="btn btn--open" href="/apps/{{ a.name }}/view" target="_blank">Open ↗</a>
      {% endif %}
    </div>
  </div>
  {% endif %}
  {% endfor %}
</div>
{% if polling %}
<!-- Re-fetches the whole catalog while anything is loading/stopping, so a
     card's badge (and the Open link once a port comes up) updates on its
     own -- settled catalogs (all ready/stopped/failed/unknown) never poll. -->
<div hx-get="/catalog" hx-trigger="every 2s" hx-target="#catalog" hx-swap="innerHTML"></div>
{% endif %}
