<!-- disco/templates/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>tt-disco</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #0F2A35; --bg1: #1A3C47; --bg2: #2D3142; --bg3: #0a1e28;
      --teal: #4FD1C5; --teal-lt: #81E6D9;
      --green: #27AE60; --pink: #EC96B8; --muted: #607D8B; --gold: #F4C471;
      --text: #E8F0F2; --text2: #B0C4DE;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg0); color: var(--text); font-size: 14px;
    }
    * { scrollbar-width: thin; scrollbar-color: rgba(79,209,197,0.2) transparent; }

    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 0 20px;
      height: 48px; background: var(--bg3);
      border-bottom: 1px solid rgba(79,209,197,0.15);
    }
    .logo { font-weight: 800; font-size: 15px; color: var(--teal); letter-spacing: -0.3px; }
    .tagline { font-size: 12px; color: var(--muted); }

    .main { padding: 36px 44px 48px; }
    .section-label {
      font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 16px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .cat-card {
      background: var(--bg1); border: 1px solid var(--bg2); border-radius: 10px;
      padding: 18px 20px 16px;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.12s;
      display: flex; flex-direction: column; gap: 10px;
    }
    .cat-card:hover {
      border-color: var(--teal);
      box-shadow: 0 0 0 1px rgba(79,209,197,0.25), 0 4px 20px rgba(0,0,0,0.3);
      transform: translateY(-2px);
    }
    .cat-card.broken { border-color: rgba(236,150,184,0.4); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .card-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .card-desc { font-size: 11px; color: var(--muted); line-height: 1.5; }

    .badge {
      font-size: 9px; padding: 2px 9px; border-radius: 10px; color: #fff;
      white-space: nowrap; text-transform: uppercase; letter-spacing: 0.4px;
      flex-shrink: 0;
    }
    .badge--active   { background: var(--green); }
    .badge--inactive { background: var(--muted); }
    .badge--failed   { background: var(--pink); color: var(--bg3); }
    .badge--unknown  { background: var(--muted); }

    .card-error {
      font-size: 11px; color: var(--pink); line-height: 1.5;
      background: var(--bg0); border: 1px solid rgba(236,150,184,0.25);
      border-radius: 6px; padding: 8px 10px;
    }

    .card-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .btn {
      font-size: 11px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--bg2);
      background: var(--bg0); color: var(--teal); cursor: pointer;
      transition: border-color 0.1s, color 0.1s; letter-spacing: 0.2px;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--teal); color: var(--teal-lt); }
    .btn--open {
      text-decoration: none; display: inline-block; color: var(--teal); font-weight: 600;
      background: rgba(79,209,197,0.08); border-color: rgba(79,209,197,0.3);
    }
    .btn--open:hover { border-color: var(--teal); background: rgba(79,209,197,0.14); }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="logo">tt-disco</span>
    <span class="tagline">local catalog of gradio demo apps</span>
  </div>
  <div class="main">
    <div class="section-label">Demos</div>
    <div id="catalog">
      {% include "_catalog.html" %}
    </div>
  </div>
</body>
</html>
